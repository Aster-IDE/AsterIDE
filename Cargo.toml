[workspace]
members = [
  "xtask",
  "asteride",
  "pages",
  "elements",

  # pre-2.0 stuff, keep this for now i guess just commented out.
  # "crates/command_palette",
  # "crates/core",
  # "crates/editor",
  # "crates/lsp",
  # "crates/plugins",
  # "crates/search",
  # "crates/settings",
  # "crates/shared",
  # "crates/tabs",
  # "crates/theme",
]

default-members = [ "asteride" ]
resolver = "3"

[workspace.package]
edition = "2024"
version = "2.0.0"
license = "Apache-2.0"
authors = [
  "playfairs <root@playfairs.cc>",
  "Invra <identificationsucks@gmail.com>"
]

[workspace.dependencies]
image = "0.25.10"
rfd = "0.17.2"

[workspace.dependencies.lucide-icons]
version = "1.24.0"
features = ["iced"]

[workspace.dependencies.elements]
path = "./elements"

[workspace.dependencies.pages]
path = "./pages"

[workspace.dependencies.tokio]
version = "1.52.3"
features = ["rt", "macros", "rt-multi-thread", "sync"]

[workspace.dependencies.iced]
version = "0.14.0"
features = ["image", "tokio"]
