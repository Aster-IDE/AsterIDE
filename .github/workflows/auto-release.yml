name: auto-release

# AUTOBUMP for AsterIDE.
#
# On every push to the default branch (master), bump the workspace
# version, commit + tag v<X.Y.Z>, and push the tag with a PAT so the
# EXISTING build.yml `release` job (if: startsWith(github.ref,
# 'refs/tags/v')) fires and publishes the cross-platform binaries +
# installers as a draft GitHub Release.
#
# This is BUMP + TAG ONLY. It does NOT build or publish artifacts —
# build.yml owns that, unchanged. AsterIDE is NOT a crates.io crate
# and NOT a Docker image, so no publish leg is wired here.
#
# ── TOKEN CAVEAT (load-bearing) ──────────────────────────────────
# A tag pushed with the default GITHUB_TOKEN does NOT trigger
# downstream workflows. The tag push MUST use a PAT (repo secret
# BOT_PAT, `repo` scope) or build.yml's release job never runs.
# Configure BOT_PAT under Settings ▸ Secrets and variables ▸ Actions.
# It falls back to GITHUB_TOKEN so the job never hard-fails when the
# PAT is absent — but the release only fires when BOT_PAT is set.

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      bump-type:
        description: "patch | minor | major"
        required: false
        default: patch

permissions:
  contents: write

# Serialize releases: two pushes to master otherwise race two bump runs
# from the same base and the second tag push is rejected non-fast-forward.
# Queue rather than cancel — an in-flight bump+tag+push must finish.
concurrency:
  group: auto-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  bump:
    name: Bump workspace + tag
    runs-on: ubuntu-latest
    # Skip when the bot itself pushed the release commit (avoids a
    # tag-push -> bump -> tag-push loop).
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
          token: ${{ secrets.BOT_PAT || secrets.GITHUB_TOKEN }}

      # Bump [workspace.package].version in the root Cargo.toml + refresh
      # Cargo.lock. Skips when no *.rs / Cargo.toml / Cargo.lock changed
      # since the last tag. AsterIDE has no Cargo.nix, so the action's
      # best-effort crate2nix regen is a logged no-op.
      - id: bump
        uses: pleme-io/actions/rust-workspace-bump@v1
        with:
          bump-type: ${{ github.event.inputs.bump-type || 'patch' }}

      # Commit + annotated tag v<X.Y.Z>. Only Cargo.toml + Cargo.lock are
      # staged — AsterIDE has no Cargo.nix / Cargo.gen.lock.
      - if: steps.bump.outputs.bumped == 'true'
        uses: pleme-io/actions/git-commit-tag@v1
        with:
          version: ${{ steps.bump.outputs.new-version }}
          commit-message-template: "release: v{version}"
          add-paths: "Cargo.toml Cargo.lock"

      # Push branch + tag with the PAT so the tag triggers build.yml's
      # release job. branch MUST be master (the action defaults to main).
      - if: steps.bump.outputs.bumped == 'true'
        uses: pleme-io/actions/git-push-with-token@v1
        with:
          token: ${{ secrets.BOT_PAT || secrets.GITHUB_TOKEN }}
          branch: master
          push-tags: "true"
