name: Build (Release)
on:
  release:
    types: [published]
jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@v14
      - name: Sync version
        run: bash scripts/sync-version.sh
      - name: Build and package DMG
        run: nix develop -c just create-mac-dmg
      - name: Build and package PKG
        run: nix develop -c just create-mac-pkg
      - name: Remove quarantine from artifacts
        run: |
          xattr -rd com.apple.quarantine build/AsterIDE.dmg 2>/dev/null || true
          xattr -rd com.apple.quarantine build/AsterIDE.pkg 2>/dev/null || true
      - name: Upload macOS DMG artifact
        uses: actions/upload-artifact@v6
        with:
          name: asteride-macos-dmg-${{ github.sha }}
          path: build/AsterIDE.dmg
          if-no-files-found: error
      - name: Upload macOS PKG artifact
        uses: actions/upload-artifact@v6
        with:
          name: asteride-macos-pkg-${{ github.sha }}
          path: build/AsterIDE.pkg
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          fetch-depth: 0
      - name: Sync version
        run: bash scripts/sync-version.sh
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev rpm
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Build Linux binary
        run: |
          cargo build --release --target x86_64-unknown-linux-gnu
          mkdir -p build
          if [ -f target/x86_64-unknown-linux-gnu/release/asteride ]; then
            cp target/x86_64-unknown-linux-gnu/release/asteride build/asteride-linux
          else
            echo "Binary not found"
            ls -la target/x86_64-unknown-linux-gnu/release/
            exit 1
          fi
      - name: Create .deb package
        run: |
          version="$(bash scripts/read-version.sh)"
          mkdir -p deb-package/DEBIAN
          mkdir -p deb-package/usr/local/bin
          mkdir -p deb-package/usr/share/applications
          mkdir -p deb-package/usr/share/icons/hicolor/256x256/apps
          
          cp build/asteride-linux deb-package/usr/local/bin/asteride
          chmod +x deb-package/usr/local/bin/asteride
          
          cat > deb-package/DEBIAN/control << EOF
          Package: asteride
          Version: ${version}
          Section: editors
          Priority: optional
          Architecture: amd64
          Maintainer: AsterIDE
          Description: A Simple Text Editor written in Rust.
          EOF
          
          cat > deb-package/usr/share/applications/asteride.desktop << EOF
          [Desktop Entry]
          Name=AsterIDE
          Comment=A Simple Text Editor written in Rust.
          Exec=/usr/local/bin/asteride
          Icon=asteride
          Type=Application
          Categories=Utility;TextEditor;
          EOF
          
          dpkg-deb --build deb-package build/AsterIDE.deb
      - name: Create .rpm package
        run: |
          mkdir -p rpm-package/BUILD
          mkdir -p rpm-package/RPMS
          mkdir -p rpm-package/SOURCES
          mkdir -p rpm-package/SPECS
          mkdir -p rpm-package/SRPMS
          
          cp build/asteride-linux rpm-package/SOURCES/asteride
          
          version="$(bash scripts/read-version.sh)"
          cat > rpm-package/SPECS/asteride.spec << EOF
          Name: asteride
          Version: ${version}
          Release: 1%{?dist}
          Summary: A Simple Text Editor written in Rust.
          License: MIT
          URL: https://github.com/Aster-IDE/AsterIDE
          Source0: asteride
          
          %description
          A Simpler Text Editor written in Rust.
          
          %prep
          %build
          
          %install
          mkdir -p %{buildroot}/usr/local/bin
          cp %{SOURCE0} %{buildroot}/usr/local/bin/asteride
          chmod +x %{buildroot}/usr/local/bin/asteride
          
          mkdir -p %{buildroot}/usr/share/applications
          cat > %{buildroot}/usr/share/applications/asteride.desktop << DESKTOPEOF
          [Desktop Entry]
          Name=AsterIDE
          Comment=A Simple Text Editor written in Rust.
          Exec=/usr/local/bin/asteride
          Icon=asteride
          Type=Application
          Categories=Utility;TextEditor;
          DESKTOPEOF
          
          %files
          /usr/local/bin/asteride
          /usr/share/applications/asteride.desktop
          
          %changelog
          * $(date +'%a %b %d %Y') AsterIDE <contact@asteride.dev> - ${version}-1
          - Initial package
          EOF
          
          rpmbuild --define "_topdir $(pwd)/rpm-package" -ba rpm-package/SPECS/asteride.spec
          
          cp rpm-package/RPMS/x86_64/asteride-${version}-1.x86_64.rpm build/AsterIDE.rpm
      - uses: actions/upload-artifact@v6
        with:
          name: asteride-linux-deb-${{ github.sha }}
          path: build/AsterIDE.deb
      - uses: actions/upload-artifact@v6
        with:
          name: asteride-linux-rpm-${{ github.sha }}
          path: build/AsterIDE.rpm

  build-freebsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          fetch-depth: 0
      - name: Sync version
        run: bash scripts/sync-version.sh
      - name: Build in FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: |
            pkg install -y curl git rust gmake
          run: |
            cargo build --release
            mkdir -p build
            if [ -f target/release/asteride ]; then
              cp target/release/asteride build/asteride-freebsd
            else
              echo "Binary not found"
              ls -la target/release/
              exit 1
            fi
      - uses: actions/upload-artifact@v6
        with:
          name: asteride-freebsd-${{ github.sha }}
          path: build/asteride-freebsd

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          fetch-depth: 0
      - name: Sync version
        run: bash scripts/sync-version.sh
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Build Windows binary
        run: |
          cargo build --release --target x86_64-pc-windows-msvc
          New-Item -ItemType Directory -Force -Path build
          if (Test-Path target/x86_64-pc-windows-msvc/release/asteride.exe) {
            Copy-Item target/x86_64-pc-windows-msvc/release/asteride.exe build/asteride.exe
          } elseif (Test-Path target/x86_64-pc-windows-msvc/release/asteride) {
            Copy-Item target/x86_64-pc-windows-msvc/release/asteride build/asteride.exe
          } else {
            Write-Host "Binary not found, listing target directory:"
            Get-ChildItem -Path target/x86_64-pc-windows-msvc/release -Recurse
            exit 1
          }
        shell: powershell
      - name: Create Windows archive
        run: |
          if (Test-Path build/asteride.exe) {
            New-Item -ItemType Directory -Force -Path temp_archive
            Copy-Item build/asteride.exe temp_archive/
            Compress-Archive -Path temp_archive/* -DestinationPath build/AsterIDE-Windows-${{ github.sha }}.zip
            Remove-Item -Recurse -Force temp_archive
          } else {
            Write-Host "Binary not found, checking target directory"
            Get-ChildItem -Path target/x86_64-pc-windows-msvc/release -Recurse
            exit 1
          }
        shell: powershell
      - uses: actions/upload-artifact@v6
        with:
          name: asteride-windows-${{ github.sha }}
          path: build/asteride.exe

  build-gentoo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          fetch-depth: 0
      - name: Create build directory
        run: mkdir -p build
      - name: Generate ebuild
        run: |
          cat > build/asteride.ebuild << EOF
          EAPI=8

          DESCRIPTION="A Simple Text Editor written in Rust"
          HOMEPAGE="https://github.com/Aster-IDE/AsterIDE"

          SRC_URI="https://github.com/Aster-IDE/AsterIDE/archive/refs/tags/v\${PV}.tar.gz -> \${P}.tar.gz"

          LICENSE="MIT"
          SLOT="0"
          KEYWORDS="~amd64"

          BDEPEND="virtual/rust"

          src_compile() {
              cargo build --release
          }

          src_install() {
              dobin target/release/asteride
          }
          EOF
      - uses: actions/upload-artifact@v6
        with:
          name: asteride-gentoo-ebuild-${{ github.sha }}
          path: build/asteride.ebuild
  
  release:
    needs: [build-macos, build-linux, build-freebsd, build-windows, build-gentoo]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download macOS DMG artifact
        uses: actions/download-artifact@v4
        with:
          name: asteride-macos-dmg-${{ github.sha }}
          path: release
      - name: Download macOS PKG artifact
        uses: actions/download-artifact@v4
        with:
          name: asteride-macos-pkg-${{ github.sha }}
          path: release
      - name: Download Linux DEB artifact
        uses: actions/download-artifact@v4
        with:
          name: asteride-linux-deb-${{ github.sha }}
          path: release
      - name: Download Linux RPM artifact
        uses: actions/download-artifact@v4
        with:
          name: asteride-linux-rpm-${{ github.sha }}
          path: release
      - name: Download FreeBSD artifact
        uses: actions/download-artifact@v4
        with:
          name: asteride-freebsd-${{ github.sha }}
          path: release
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: asteride-windows-${{ github.sha }}
          path: release
      - name: Download Gentoo ebuild artifact
        uses: actions/download-artifact@v4
        with:
          name: asteride-gentoo-ebuild-${{ github.sha }}
          path: release
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          draft: true
          files: |
            release/AsterIDE.dmg
            release/AsterIDE.pkg
            release/AsterIDE.deb
            release/AsterIDE.rpm
            release/asteride-freebsd
            release/asteride.exe
            release/asteride.ebuild
          name: AsterIDE ${{ github.ref_name }}
          fail_on_unmatched_files: true
